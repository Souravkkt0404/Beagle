<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account with our simple and secure signup form.">
  <title>Sign Up | Create Your Account</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <p class="eyebrow">Welcome</p>
    <h1>Create your account</h1>
    <p class="intro">Join us today. It only takes a minute to get started.</p>
  </header>

  <main>
    <section class="form-panel" aria-labelledby="signup-title">
      <h2 id="signup-title">Sign up</h2>
      <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>

      <form action="#" method="post">
        <div class="field">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password <span aria-hidden="true">*</span></label>
          <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password <span aria-hidden="true">*</span></label>
          <input type="password" id="confirm-password" name="confirm-password" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="field">
          <label for="date-of-birth">Date of birth <span aria-hidden="true">*</span></label>
          <input type="date" id="date-of-birth" name="date-of-birth" autocomplete="bday" required>
        </div>

        <fieldset class="field radio-group">
          <legend>Gender <span aria-hidden="true">*</span></legend>
          <div class="radio-options">
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
          </div>
        </fieldset>

        <label class="checkbox-label">
          <input type="checkbox" name="terms" required>
          <span>I agree to the <a href="#terms">terms and conditions</a> <span aria-hidden="true">*</span></span>
        </label>

        <button type="submit">Sign up</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Already have an account? <a href="#login">Log in</a></p>
  </footer>
</body>

</html>
